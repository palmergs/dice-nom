[package]
name = "dice-nom"
version = "0.5.0"
authors = ["Galen Palmer <palmergs@gmail.com>"]
edition = "2021"
description = "A library that utilizes the nom parser for randomly generating numbers to support role-playing games."
license-file = "LICENSE"
repository = "https://github.com/palmergs/dice-nom"
documentation = "https://docs.rs/dice-nom"
homepage = "https://github.com/palmergs/dice-nom"
readme = "README.md"
keywords = ["dice", "rpg", "parser", "random", "gaming"]
categories = ["games", "parsing", "command-line-utilities"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "roll"
path = "src/bin/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nom = "8.0"
rand = "0.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
